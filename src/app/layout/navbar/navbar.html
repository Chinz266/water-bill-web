<!-- แถบบนสุด: ชื่อระบบ + เมนู (จอใหญ่) + ชื่อผู้ใช้และปุ่มออกจากระบบ -->
<header class="topbar">
  <a class="brand" routerLink="/home">
    <span class="brand-mark">💧</span>
    <span class="brand-text">
      <span class="brand-title">ค่าน้ำประปาหมู่บ้าน</span>
      <span class="brand-sub">ระบบบันทึกและออกบิล</span>
    </span>
  </a>

  <nav class="desk-menu" aria-label="เมนูหลัก">
    <a routerLink="/home" routerLinkActive="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      หน้าแรก
    </a>
    <a routerLink="/scan-batch" routerLinkActive="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
      สแกนมิเตอร์
    </a>
    <a routerLink="/history" routerLinkActive="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
      ประวัติบิล
    </a>
    <a routerLink="/members" routerLinkActive="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6"/><path d="M17.5 14.2A5.2 5.2 0 0 1 21 19"/></svg>
      ลูกบ้าน
    </a>
    <a routerLink="/reports" routerLinkActive="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      แจ้งเรื่อง
    </a>
    <a routerLink="/unassigned" routerLinkActive="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h13"/><path d="M3 12h9"/><path d="M3 19h7"/><circle cx="18" cy="16" r="4"/><path d="M18 14.5v1.5l1 1"/></svg>
      รอจับคู่
    </a>
    <a routerLink="/audit" routerLinkActive="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V4a1 1 0 0 1 1-1h9l6 4v6"/><path d="M4 14h8"/><path d="m15 18 2 2 4-4"/></svg>
      ตรวจสอบย้อนหลัง
    </a>
    <a routerLink="/village-settings" routerLinkActive="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      ตั้งค่าหมู่บ้าน
    </a>
  </nav>

  <div class="topbar-user">
    <a class="user-meta" routerLink="/account" routerLinkActive="is-active" title="ตั้งค่าผู้ดูแล">
      <span class="user-avatar">
        @if (photo()?.photo) {
          <img [src]="photo()!.photo" alt="รูปผู้ดูแล" />
        } @else {
          🧑‍💼
        }
      </span>
      <span class="user-text">
        <span class="user-name">{{ displayName() }}</span>
        <span class="user-role">ผู้ดูแลระบบ · ตั้งค่า</span>
      </span>
    </a>
    <!-- จอต่ำกว่า 1440px เหลือแต่ไอคอน (ดู .logout-text ใน navbar.css) จึงต้องมีชื่อกำกับไว้ -->
    <button type="button" class="btn btn-ghost btn-sm logout-btn" title="ออกจากระบบ" aria-label="ออกจากระบบ" (click)="onLogout()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></svg>
      <span class="logout-text">ออกจากระบบ</span>
    </button>
  </div>
</header>
