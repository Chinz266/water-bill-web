<!-- แถบบนสุด: ชื่อระบบ + เมนู (จอใหญ่) + ชื่อผู้ใช้และปุ่มออกจากระบบ -->
<header class="topbar">

      <span class="logout-text">ออกจากระบบ</span>

  </div>
</header>
