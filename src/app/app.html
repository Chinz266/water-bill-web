<ngx-sonner-toaster [position]="'top-center'" [richColors]="true" [duration]="3000"></ngx-sonner-toaster>

<!-- 🌟 navbar เจ้าหน้าที่โชว์เฉพาะ admin — หน้า login/register และพอร์ทัลลูกบ้านจะเต็มจอ -->
@if (isAdmin()) {
  <app-navbar></app-navbar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
} @else {
  <router-outlet></router-outlet>
}
