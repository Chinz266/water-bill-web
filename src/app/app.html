<ngx-sonner-toaster [position]="'top-center'" [richColors]="true" [duration]="3000"></ngx-sonner-toaster>

<!-- 🌟 ยังไม่ได้ล็อกอิน = ไม่ต้องโชว์ navbar (หน้า login/register จะเต็มจอ) -->
@if (isLoggedIn()) {
  <app-navbar></app-navbar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
} @else {
  <router-outlet></router-outlet>
}

<!-- เอกสารบิลสำหรับสั่งพิมพ์ (ซ่อนบนจอ) — ใช้ร่วมกันทุกหน้า -->
<app-bill-print></app-bill-print>
