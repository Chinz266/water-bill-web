<div class="welcome-page">
  <div class="welcome-box">
    <div class="welcome-header">
      <div class="welcome-logo">💧</div>
      <h1>ค่าน้ำประปาหมู่บ้าน</h1>
      <p>เลือกทางเข้าใช้งานของคุณได้เลยครับ</p>
    </div>

    <!-- ปุ่มเลือกประเภทผู้ใช้ — queryParamsHandling เก็บ redirectTo ไว้ให้หน้า login พากลับถูกที่ -->
    <div class="role-buttons">
      <a class="role-card" routerLink="/member/login" queryParamsHandling="preserve">
        <span class="role-icon">🏠</span>
        <span class="role-text">
          <span class="role-title">ลูกบ้าน</span>
          <span class="role-desc">ดูบิลค่าน้ำบ้านของฉัน · เข้าด้วยเบอร์โทร</span>
        </span>
        <svg class="role-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>

      <a class="role-card staff" routerLink="/login" queryParamsHandling="preserve">
        <span class="role-icon">🧑‍💼</span>
        <span class="role-text">
          <span class="role-title">เจ้าหน้าที่หมู่บ้าน</span>
          <span class="role-desc">จดมิเตอร์ ออกบิล จัดการลูกบ้าน · เข้าด้วยอีเมล</span>
        </span>
        <svg class="role-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </div>

    <p class="welcome-hint">
      ลูกบ้านเข้าดูได้ทันทีด้วยเบอร์โทรที่แจ้งไว้กับหมู่บ้าน ไม่ต้องสมัครหรือจำรหัสผ่าน
    </p>
  </div>
</div>
