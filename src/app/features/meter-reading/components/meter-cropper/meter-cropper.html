<div class="cropper-container">
  <div class="header-section">
    <h2>📷 อัปโหลดและครอบตัดเลขมิเตอร์</h2>
    <p class="subtitle">เลือกรูปภาพมิเตอร์น้ำและปรับแต่งขนาดเพื่อส่งให้ AI วิเคราะห์</p>
  </div>
  
  <div class="file-upload-wrapper">
    <label for="file-upload" class="custom-file-upload">
      📁 เลือกรูปภาพมิเตอร์น้ำ
    </label>
    <input id="file-upload" type="file" (change)="fileChangeEvent($event)" accept="image/*" />
  </div>

  <div class="main-workspace" *ngIf="imageChangedEvent">
    <!-- Controls Panel -->
    <div class="control-panel">
      <!-- Aspect Ratio Toggle -->
      <div class="control-group">
        <span class="group-label">อัตราส่วนการครอบ:</span>
        <div class="toggle-buttons">
          <button type="button" class="toggle-btn" [class.active]="!maintainAspectRatio" (click)="maintainAspectRatio = false">
            อิสระ (Freeform)
          </button>
          <button type="button" class="toggle-btn" [class.active]="maintainAspectRatio" (click)="maintainAspectRatio = true">
            ล็อค 3:1 (มิเตอร์ทั่วไป)
          </button>
        </div>
      </div>

      <!-- Transform Controls -->
      <div class="control-group">
        <span class="group-label">ปรับแต่งรูปภาพ:</span>
        <div class="action-buttons">
          <button type="button" class="action-btn" (click)="rotateLeft()" title="หมุนซ้าย 90°">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
            หมุนซ้าย
          </button>
          <button type="button" class="action-btn" (click)="rotateRight()" title="หมุนขวา 90°">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
            หมุนขวา
          </button>
          <button type="button" class="action-btn" (click)="flipHorizontal()" title="กลับด้านแนวนอน">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12H2"/><path d="M10 2 2 12l8 10"/><path d="m14 2 8 10-8 10"/></svg>
            สลับแนวนอน
          </button>
          <button type="button" class="action-btn" (click)="flipVertical()" title="กลับด้านแนวตั้ง">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m2 10 10-8 10 8"/><path d="m2 14 10 8 10-8"/></svg>
            สลับแนวตั้ง
          </button>
          <button type="button" class="action-btn" (click)="zoomIn()" title="ซูมเข้า">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            ซูมเข้า
          </button>
          <button type="button" class="action-btn" (click)="zoomOut()" title="ซูมออก">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            ซูมออก
          </button>
          <button type="button" class="action-btn reset-btn" (click)="resetImage()" title="รีเซ็ตการปรับแต่ง">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            รีเซ็ต
          </button>
        </div>
      </div>
    </div>

    <div class="result-workspace">
      <button class="btn-submit" (click)="uploadToBackend()" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'กำลังส่งภาพให้ระบบ AI วิเคราะห์...' : '⚡ สกัดตัวเลขค่าน้ำ' }}
      </button>
    </div>
  </div>

  <div *ngIf="aiResult" class="result-box">
    <h3>🤖 ผลการวิเคราะห์จาก AI:</h3>
    <div class="big-number-container">
      <p class="big-number">{{ aiResult.read_unit }}</p>
      <span class="unit-text">หน่วย (m³)</span>
    </div>
    <p class="status-msg">🔹 สถานะระบบ: {{ aiResult.message || 'ดึงข้อมูลสำเร็จ' }}</p>
  </div>
</div>
